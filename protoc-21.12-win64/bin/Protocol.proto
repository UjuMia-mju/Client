syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string userId = 1;
	string psw = 2;
}

message S_LOGIN
{
	bool success = 1;
	Player player = 2;
}

// ==================== 방 생성 ====================
message C_CREATE_ROOM
{
}

message S_CREATE_ROOM
{
	bool success = 1;
	RoomInfo room = 2; // 생성된 방 정보
	string error_msg = 3; // 실패 시 오류 메시지
}

// ==================== 방 목록 조회 ====================
message C_ROOM_LIST
{
}

message S_ROOM_LIST
{
	repeated RoomInfo rooms = 1;
}

// ==================== 방 입장 ====================
message C_ENTER_ROOM
{
	uint64 room_id = 1;
}

message S_ENTER_ROOM
{
	bool success = 1;
	RoomInfo room = 2;
	repeated RoomMemberInfo members = 3;
	string error_msg = 4;
}

// ==================== 방 퇴장 ====================
message C_LEAVE_ROOM
{
}

message S_LEAVE_ROOM
{
	bool success = 1;
	uint64 player_id = 2;
}

// ==================== 초대 보내기 ====================
message C_INVITE_PLAYER
{
	string player_name = 1;
	int32 player_tag = 2; // 고유 번호 1234
}

message S_INVITE_PLAYER
{
	bool success = 1;
	string player_name = 2;
	int32 player_tag = 3; // 고유 번호 1234
	string error_msg = 4;
}

// ==================== 초대 알림 ====================
message S_INVITE_NOTIFICATION
{
	uint64 room_id = 1;
	string room_name = 2;
	string inviter_name = 3;
	uint64 invite_id = 4;
}

// ==================== 초대 응답 ====================
message C_INVITE_RESPONSE
{
	uint64 invite_id = 1;
	bool accept = 2;
}

message S_INVITE_RESPONSE
{
	bool success = 1;
	string error_msg = 2;
}

// ==================== 방 멤버 입장 알림 ====================
message S_ROOM_MEMBER_ENTER
{
	RoomMemberInfo member = 1;
}

// ==================== 방 멤버 퇴장 알림 ====================
message S_ROOM_MEMBER_LEAVE
{
	uint64 player_id = 1;
	string player_name = 2;
	uint64 new_owner_id = 3; // 방장이 퇴장할 경우 새로운 방장 ID (0이면 방이 삭제됨)
}

// ==================== 준비 상태 변경 ====================
message C_READY
{
	bool is_ready = 1;
}

message S_READY
{
	uint64 player_id = 1;
	bool is_ready = 2;
}

// ==================== 게임 시작(방 시작) ====================

message C_START_ROOM
{
}

message S_START_ROOM
{
	bool success = 1;
	string error_msg = 2;
}


// ==================== 채팅 ====================
message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}

// ==================== 게임 입장(실제 게임 스테이지 진입) ====================

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
}

// ==================== 게임 플레이 ====================

// 플레이어 움직임
message C_MOVE
{
	PosInfo pos = 1;
	RotInfo rot = 2;
}

message S_MOVE
{
	uint64 playerId = 1;
	PosInfo pos = 2;
	RotInfo rot = 3;
}

// 플레이어 정보
message S_PLAYER_LIST
{
	repeated PlayerInfo players = 1;
}

message S_PLAYER_ENTER
{
	PlayerInfo player = 1;
}

message S_PLAYER_LEAVE
{
	PlayerInfo player = 1;
}

// 플레이어 애니메이션 상태
message C_ANIMATION
{
    int32 state = 1;
}

message S_ANIMATION
{
    uint64 playerId = 1;
    int32 state = 2;
}