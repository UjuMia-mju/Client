syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string userId = 1;
	string psw = 2;
}

message S_LOGIN
{
	bool success = 1;
	Player player = 2;
}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}

// 플레이어 움직임
message C_MOVE
{
	PosInfo pos = 1;
	RotInfo rot = 2;
}

message S_MOVE
{
	uint64 playerId = 1;
	PosInfo pos = 2;
	RotInfo rot = 3;
}

// 플레이어 정보
message S_PLAYER_LIST
{
	repeated PlayerInfo players = 1;
}

message S_PLAYER_ENTER
{
	PlayerInfo player = 1;
}

message S_PLAYER_LEAVE
{
	PlayerInfo player = 1;
}

message C_STAGE_INFO
{
	int32 stageId = 1;
}

message S_STAGE_INFO
{
	int32 stageId = 1;
	string chapter = 2;
	string leftText = 3;
	string rightText = 4;
}