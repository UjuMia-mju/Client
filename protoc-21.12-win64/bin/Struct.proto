syntax = "proto3";
package Protocol;

import "Enum.proto";

message Player
{
	uint64 id = 1;
	string name = 2;
	int32 tag = 3;
}

message PosInfo
{
	float x = 1;
	float y = 2;
	float z = 3;
}

message RotInfo
{
	float x = 1;
	float y = 2;
	float z = 3;
	float w = 4;
}

message PlayerInfo
{
    uint64 player_id = 1;
    string name = 2;
    PosInfo pos = 3;
    RotInfo rot = 4;
}

// 방 정보
message RoomInfo
{
	uint64 room_id = 1;
	string room_name = 2;
	Player host = 3; // 방장 정보
	int32 current_count = 4;
	int32 max_count = 5;
	bool is_playing = 6; // 게임 진행 중 여부
}

// 방 멤버 정보
message RoomMemberInfo
{
	Player player = 1;
	bool is_ready = 2; // 준비 상태
}

// 스테이지 정보
message StageInfo
{
	int32 stage_level = 1;      // 스테이지 레벨 (월드)
	int32 stage_index = 2;      // 스테이지 번호
	string stage_name = 3;      // 스테이지 이름 (예: "화산 던전")
	string description = 4;     // 스테이지 설명
	int32 difficulty = 5;       // 난이도 (1~5)
}

// 스테이지 클리어 정보
message StageClearInfo
{
	int32 stage = 1;           // 스테이지 번호
	int32 level = 2;           // 난이도
	int32 star = 3;            // 별점 (1~3)
	int64 clear_time = 4;      // 클리어 시간 (유닉스 타임스탬프)
}

message ObjectId
{
	ObjectType type = 1; // TOOL 또는 ITEM
	
	// oneof로 둘 중 하나만 사용
	oneof id {
		ToolType tool_type = 2;  // 도구인 경우
		uint64 item_id = 3;      // 아이템인 경우
	}
}

// ==================== 오브젝트 정보 ====================
message ObjectInfo
{
	ObjectId object_id = 1;
	string name = 2;
	PosInfo pos = 3;
	RotInfo rot = 4;
	uint64 owner_id = 5;
}