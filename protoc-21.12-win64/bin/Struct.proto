syntax = "proto3";
package Protocol;

import "Enum.proto";

message Player
{
	int32 id = 1;
	string name = 2;
	int32 tag = 3;
}

// 유저 상세 정보
message PlayerInfo
{
    int32 player_id = 1;
    int32 coin = 2;
	int32 gem = 3;
	repeated int32 owned_skins = 4;
}

// 유저 인게임 정보 (위치)
message PlayerGameInfo
{
	int32 player_id = 1;
	string name = 2;
    PosInfo pos = 3;
    RotInfo rot = 4; 
}


// ==================== 가챠 시스템 ====================
message SkinInfo
{
	int32 skin_id = 1;
	string skin_name = 2;
	string skin_des = 3; // 스킨 설명
	int32 rarity = 4; // 1:일반, 2:레어, 3:에픽, 4:레전더리
}

message GachaResult
{
	repeated SkinInfo obtained_skins = 1;
	int32 gems_spent = 2;
	int32 remaining_gems = 3;
	int32 coin_spent = 4;
	int32 remaining_coins = 5;
}

message GachaPoolInfo
{
	int32 pool_id = 1;
	string pool_name = 2;
	string pool_type = 3; // ex) "normal", "event"
	int32 cost_gem = 4;
	int32 max_pull = 5; // 1회 최대 뽑기 개수 (없어도 될듯 한데.. 일단 구현)
	bool is_active = 6;
	int64 start_at = 7;
	int64 end_at = 8;
}

message PosInfo
{
	float x = 1;
	float y = 2;
	float z = 3;
}

message RotInfo
{
	float x = 1;
	float y = 2;
	float z = 3;
	float w = 4;
}

// 방 정보
message RoomInfo
{
	uint64 room_id = 1;
	string room_name = 2;
	Player host = 3; // 방장 정보
	int32 current_count = 4;
	int32 max_count = 5;
	bool is_playing = 6; // 게임 진행 중 여부
}

// 방 멤버 정보
message RoomMemberInfo
{
	Player player = 1;
	bool is_ready = 2; // 준비 상태
}

// 스테이지 정보
message StageInfo
{
	int32 stage_level = 1;      // 스테이지 레벨 (월드)
	int32 stage_index = 2;      // 스테이지 번호
	string stage_name = 3;      // 스테이지 이름 (예: "화산 던전")
	string description = 4;     // 스테이지 설명
	int32 difficulty = 5;       // 난이도 (1~5)
}

// 스테이지 클리어 정보
message StageClearInfo
{
	int32 stage = 1;           // 스테이지 번호
	int32 level = 2;           // 난이도
	int32 star = 3;            // 별점 (1~3)
	int64 clear_time = 4;      // 클리어 시간 (유닉스 타임스탬프)
}

message ObjectId
{
	ObjectType type = 1; // TOOL 또는 ITEM
	
	// oneof로 둘 중 하나만 사용
	oneof id {
		ToolType tool_type = 2;  // 도구인 경우
		uint64 item_id = 3;      // 아이템인 경우
	}
}

// ==================== 오브젝트 정보 ====================
message ObjectInfo
{
	ObjectId object_id = 1;
	string name = 2;
	PosInfo pos = 3;
	RotInfo rot = 4;
	uint64 owner_id = 5;
}

// ==================== 스탯 이벤트 데이터 ====================

// 데미지 이벤트
message DamageEventData
{
	DamageSource source = 1;  // 데미지 원인
	uint64 attacker_id = 2;    // 공격자 (환경 데미지면 0)
	int32 damage_amount = 3;   // 클라가 제안한 데미지 (서버가 검증)
}

// 힐 이벤트
message HealEventData
{
	HealSource source = 1;     // 회복 원인
	int32 heal_amount = 2;     // 회복량
}

// 아이템 사용 이벤트
message ItemUseEventData
{
	uint64 item_id = 1;        // 사용한 아이템
	ItemType item_type = 2;
}

// 산소 이벤트
message OxygenEventData
{
	OxygenChangeType change_type = 1; // CONSUME, RESTORE
	float amount = 2;
}